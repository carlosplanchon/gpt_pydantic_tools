[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-pydantic-tools"
version = "0.3"
authors = [
    {name = "Carlos A. Planchón", email = "carlosandresplanchonprestes@gmail.com"}
]
requires-python = ">=3.11"
description = "Define GPT tool schemas using Pydantic."
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed"
]

license = "MIT"
license-files = ["LICENSE"]

keywords = ["gpt", "ai", "tool", "schemas", "pydantic", "json"]
readme = "README.md"
dependencies=[
    "pydantic>=2.7.1",
    "jsonschema>=4.22.0"
]

[project.urls]
Repository = "https://github.com/carlosplanchon/gpt-pydantic-tools.git"

[tool.setuptools]
packages = ["gpt_pydantic_tools"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=2", "types-jsonschema>=4.22"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Select the classic default ruleset explicitly (pyflakes + a pycodestyle
# subset) so linting stays deterministic across ruff releases. ruff 0.16
# widened its implicit default.
select = ["E4", "E7", "E9", "F"]
